# Knife 8 — inprocess stage-2 closed loop (file job + independent artifact_review).
# Same hello file task; force_lead_review enables the public acceptance gate.
# Default TeleAgent entry is unchanged (hello.charter.yaml stays force_lead_review: false).

name: hello-inprocess-closed-loop
task_kind: file_task
goal: "In the collab workspace only, create hello-from-worker.txt with exactly one short greeting line, then stop."

must:
  - Stay inside the assigned workspace
  - Create the artifact named in done_when.artifacts
  - Stop when the file exists

must_not:
  - Read or copy credentials, tokens, cookies, or secret files
  - Use always-approve / yolo / global auto-approve
  - Touch directories outside the workspace
  - Install system packages or change services

allow_secret_globs: []
allow_paths: []
allow_keys: []

network_allow: []
install_roots: []
lead_review_steps:
  - job_end
user_gate_permissions:
  - sudo
  - credential_store_write

allowed_surfaces:
  - workspace_fs
  - lead_approved_tools

done_when:
  artifacts:
    - hello-from-worker.txt

acceptance: |
  hello-from-worker.txt exists under the collab workspace and contains exactly
  one non-empty text line.

rollback: |
  Delete hello-from-worker.txt from the workspace if the greeting is wrong.

timeout_sec: 60
max_reworks: 1
force_lead_review: true
