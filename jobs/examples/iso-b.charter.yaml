# Knife 9 — independent inprocess job B. Distinct name + artifact from iso-a.
# Isolation is by separate workdir, not by process instance.

name: iso-b
task_kind: file_task
goal: "In the assigned workspace only, create iso-b.txt with exactly one short line, then stop."

must:
  - Stay inside the assigned workspace
  - Create the artifact named in done_when.artifacts
  - Stop when the file exists

must_not:
  - Read or copy credentials, tokens, cookies, or secret files
  - Use always-approve / yolo / global auto-approve
  - Touch directories outside the workspace
  - Write into another job's workdir
  - Install system packages or change services

allow_secret_globs: []
allow_paths: []
allow_keys: []

network_allow: []
install_roots: []
lead_review_steps:
  - job_end
user_gate_permissions:
  - sudo
  - credential_store_write

allowed_surfaces:
  - workspace_fs
  - lead_approved_tools

done_when:
  artifacts:
    - iso-b.txt

acceptance: |
  iso-b.txt exists under this job's workspace and contains exactly one
  non-empty text line. It must not appear in another job's workdir.

rollback: |
  Delete iso-b.txt from this job's workspace.

timeout_sec: 60
force_lead_review: false
